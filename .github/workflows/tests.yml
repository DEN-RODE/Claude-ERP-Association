name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Construire le bundle
        run: node build.js

      - name: Verifier que le bundle versionne est a jour
        run: |
          if ! git diff --quiet -- bundle/; then
            echo "bundle/ n'est pas a jour. Lance 'node build.js' et commite le resultat."
            git diff --stat -- bundle/
            exit 1
          fi

      - name: Syntaxe du bundle
        run: cp bundle/Code.gs /tmp/Code.cjs && node --check /tmp/Code.cjs

      - name: Syntaxe du script embarque dans App.html
        run: |
          node -e "
            const fs=require('fs');
            const s=fs.readFileSync('src/App.html','utf8');
            const m=s.match(/<script>([\s\S]*)<\/script>/);
            if(!m){console.error('aucun bloc script trouve dans App.html');process.exit(1)}
            fs.writeFileSync('/tmp/app.cjs',m[1]);
          "
          node --check /tmp/app.cjs

      - name: Suite de tests
        run: node tests/run.js

      - name: Aucune donnee d'une structure reelle dans le code
        run: node tests/run.js aucune-donnee
