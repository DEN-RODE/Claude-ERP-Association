<script>
(function () {
  'use strict';

  // ================= base =================
  var S = { pin: '', view: 'accueil', param: null, data: {}, profil: 'gestion', fondPret: false };
  window.ERP = S;   // état visible pour les tests automatisés, aucune donnée n'en sort

  // ---- vocabulaire : les mots de la structure, envoyés avec le bootstrap ----
  // Les identifiants internes restent stables (eleve, cours, stage) ; seuls les
  // mots affichés changent. V('membres') -> "adhérents", "licenciés", "élèves"...
  var VOC_DEFAUT = { membre: 'inscrit', membres: 'inscrits', cours: 'cours', coursPl: 'cours', stage: 'stage', stagePl: 'stages', lieu: 'sur place', activite: 'activité' };
  var VOC = VOC_DEFAUT;
  try { if (window.__INFO && window.__INFO.voc) VOC = Object.assign({}, VOC_DEFAUT, window.__INFO.voc); } catch (e) { }
  function V(k) { return VOC[k] !== undefined ? VOC[k] : k; }
  function Vmaj(k) { var t = V(k); return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }
  window.ERP.V = V;

  // seul réglage d'affichage gardé par le navigateur : aucune donnée personnelle n'est écrite sur disque
  try { if (localStorage.getItem('erpProfil')) S.profil = localStorage.getItem('erpProfil'); } catch (e) { }
  try { S.pin = localStorage.getItem('erp_pin') || ''; } catch (e) {}

  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function eur(n) { var v = Number(n) || 0; return v.toLocaleString('fr-FR', { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 }) + ' €'; }
  function initials(e) { return (String(e.prenom || '?')[0] + String(e.nom || ' ')[0]).trim().toUpperCase(); }
  // liens venant des Sheets : uniquement http(s)
  function safeUrl(u) { u = String(u || '').trim(); return /^https?:\/\//i.test(u) ? u : '#'; }
  function safeImg(d) { return /^data:image\/(png|jpe?g|gif|webp);base64,[A-Za-z0-9+\/=]+$/.test(String(d || '')) ? d : ''; }
  function todayIso() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function frToIso(s) { var m = String(s || '').match(/^(\d{2})\/(\d{2})\/(\d{4})/); return m ? m[3] + '-' + m[2] + '-' + m[1] : String(s || ''); }
  // extrait les numéros (FR 0x xx xx xx xx, +33 / +41, 0041...) même collés les uns aux autres
  function phones(txt) {
    var out = [], re = /\+?\d[\d .\-\/]{7,}\d/g, m;
    while ((m = re.exec(String(txt || '')))) {
      var s = m[0].replace(/[ .\-\/]/g, '');
      while (s.length >= 9) {
        var n = s[0] === '+' ? 12 : (s.indexOf('00') === 0 ? 13 : (s[0] === '0' ? 10 : (/^(33|41)/.test(s) ? 11 : s.length)));
        out.push(s.slice(0, n)); s = s.slice(n);
      }
    }
    return out;
  }
  function fmtTel(p) { return /^0\d{9}$/.test(p) ? p.replace(/(\d{2})(?=\d)/g, '$1 ') : p; }
  function telLinks(txt) {
    return phones(txt).map(function (p) {
      return '<a class="tel" href="tel:' + esc(p) + '">' + ICON.phone + esc(fmtTel(p)) + '</a>';
    }).join('');
  }

  // erreurs Google traduites (le cas classique : plusieurs comptes Google ouverts dans Chrome)
  function msgErreur(e) {
    var m = String(e && e.message || e || '');
    if (/403|PERMISSION|autoris|authoriz|NetworkError|storage|sign ?in|connexion/i.test(m))
      return 'Google bloque l\'accès : plusieurs comptes Google sont sans doute ouverts dans ce navigateur. Ouvre l\'ERP dans une fenêtre de navigation privée (ou un profil Chrome) avec un seul compte, ou déconnecte les autres comptes.';
    return m || 'Erreur inconnue';
  }
  function call(action, payload) {
    S.nCalls = (S.nCalls || 0) + 1;   // compteur d'allers-retours serveur, lu par les tests
    return new Promise(function (resolve, reject) {
      if (!window.google || !google.script) return reject(new Error('Hors Apps Script'));
      google.script.run
        .withSuccessHandler(function (raw) {
          var r;
          try { r = JSON.parse(raw); } catch (e) { return reject(new Error('Réponse illisible')); }
          if (r.ok) { if (!LECTURES[action]) apresEcriture(action); return resolve(r.data); }
          if (r.error === 'PIN' || r.error === 'LOCK') { showPin(r.message); return reject(new Error(r.message)); }
          if (r.error === 'NOPIN') { noPin(r.message); return reject(new Error(r.message)); }
          reject(new Error(r.message || 'Erreur'));
        })
        .withFailureHandler(function (e) { reject(new Error(msgErreur(e))); })
        .api(action, payload || {}, S.pin);
    });
  }

  // ---------- cache (mémoire du navigateur, jamais sur disque : données santé) ----------
  // Tout est chargé à la connexion (barre de chargement). Ensuite les pages s'affichent depuis le cache,
  // sans attendre le serveur. On ne recharge que : ce qu'une modification touche (en arrière-plan),
  // tout toutes les 30 min (en arrière-plan), ou tout sur le bouton Actualiser.
  var PAGES = {};
  var FRAIS = 30 * 60 * 1000;
  var LECTURES = { achats: 1, intervenants: 1, facturesInterv: 1, propositionFacture: 1, remunerations: 1, attente: 1, mailVoir: 1, dossierDevis: 1, mediasDossiers: 1, urgencesTous: 1, brouillonVoir: 1, info: 1, ping: 1, accueil: 1, cours: 1, stages: 1, recherche: 1, eleve: 1, champs: 1, urgencesGroupe: 1, compta: 1, factures: 1, apercuMail: 1, aRelancer: 1, mails: 1, rappels: 1, notesSite: 1, agenda: 1, medias: 1, miniature: 1, texteDoc: 1, docs: 1, rapports: 1, groupes: 1, appel: 1, appelsTous: 1 };
  var ELEVES = ['cours', 'stages', 'accueil', 'urgencesTous', 'aRelancer'];
  // ce que chaque modification rend périmé (rechargé en arrière-plan, rien d'autre)
  var DEPS = {
    suivi: ELEVES.concat(['compta', 'appel*']), ajouterInscription: ELEVES.concat(['appel*']), modifierInscription: ELEVES, rattacherCours: ELEVES.concat(['appel*']), supprimerInscription: ELEVES.concat(['appel*']),
    deplacer: ELEVES.concat(['appel*']), brouillon: ['mails', 'aRelancer'], envoyerMail: ['aRelancer', 'accueil'], brouillonsRelance: ['mails', 'aRelancer', 'accueil'], noterRelance: ['aRelancer', 'accueil'],
    brouillonEnvoyer: ['mails', 'accueil'], mailsAction: ['mails', 'accueil'], uploadMedia: [], brouillonModifier: ['mails'], brouillonSupprimer: ['mails', 'accueil'],
    ajouterDepense: ['compta'], ajouterRecette: ['compta'], saveAchat: ['achats', 'compta'], payerAchat: ['achats', 'compta', 'factures'], supprimerAchat: ['achats'],
    saveRemuneration: ['remunerations', 'compta', 'achats'], saveIntervenant: ['intervenants'], reinitNumInterv: ['intervenants'], conventionCollective: [], creerFactureInterv: ['facturesInterv', 'intervenants', 'achats', 'compta'], envoyerFactureInterv: ['facturesInterv'], supprimerFactureInterv: ['facturesInterv', 'achats'], supprimerLigneCompta: ['compta'], modifierCaisse: ['compta'], modifierLigneCompta: ['compta'], uploadJustificatif: [],
    creerFacture: ['factures', 'compta'], statutFacture: ['factures', 'compta'], saveRappel: ['rappels', 'accueil'], deleteRappel: ['rappels', 'accueil'],
    saveNoteSite: ['notesSite'], statutNoteSite: ['notesSite'], deleteNoteSite: ['notesSite'], creerEvenement: ['agenda', 'accueil'], rafraichirMedias: [], saveAppel: [], syncModeleEco: ['compta'], saveAttente: ['cours', 'stages', 'attente'], statutAttente: ['cours', 'stages', 'attente'], supprimerAttente: ['cours', 'stages', 'attente'], reglagesGroupe: ['cours', 'stages', 'accueil']
  };
  var REQ = { agenda: { jours: 21 } };
  var RENDU = {};   // clé -> page affichée qui l'utilise (pour la remettre à jour si les données changent)
  function appelCle(key) { var x = key.split('|'); return { source: x[1], cle: x.slice(2).join('|') }; }
  // Une demande déjà en route n'est pas relancée : Apps Script traite les appels d'un même
  // utilisateur à la file, donc deux demandes identiques doublent l'attente au lieu de la partager.
  // Cas typique : le préchargement de la fiche d'appel et le clic sur « Faire l'appel ».
  var ENCOURS = {};
  function charger(key, payload) {
    if (ENCOURS[key]) return ENCOURS[key];
    var pr = key.indexOf('appel|') === 0 ? call('appel', appelCle(key)) : call(key, payload || REQ[key] || {});
    var job = pr.then(function (d) { return ranger(key, d); });
    ENCOURS[key] = job;
    job.then(function () { delete ENCOURS[key]; }, function () { delete ENCOURS[key]; });
    return job;
  }
  function ranger(key, d) {
    var js = JSON.stringify(d), avant = PAGES[key];
    PAGES[key] = { data: d, js: js, t: Date.now() };
    if (avant && avant.js !== js) redessiner(key);
    return d;
  }
  function redessiner(key) {
    var r = RENDU[key];
    if (!r || r.gen !== S.gen) return;
    var ae = document.activeElement;
    if (ae && ae.closest && ae.closest('#view') && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) return; // on ne casse pas une saisie
    try { r.fn(); } catch (e) { }
  }
  /**
   * Plusieurs lectures en UN aller-retour serveur (action « bloc »).
   * Apps Script traite les appels d'un même utilisateur à la file : seize appels lancés
   * ensemble s'empilent côté serveur. Les regrouper supprime quinze latences réseau.
   * Les fiches d'appel gardent leur appel propre (chacune a son paramètre).
   */
  function chargerBloc(keys) {
    keys = keys.filter(function (k, i) { return keys.indexOf(k) === i; });
    var seuls = keys.filter(function (k) { return k.indexOf('appel|') === 0; });
    var group = keys.filter(function (k) { return k.indexOf('appel|') !== 0; });
    var err = null, garde = function (e) { if (!err) err = e; };
    var jobs = seuls.map(function (k) { return charger(k).catch(garde); });
    if (group.length === 1) jobs.push(charger(group[0]).catch(garde));
    else if (group.length) {
      var params = {};
      group.forEach(function (k) { if (REQ[k]) params[k] = REQ[k]; });
      jobs.push(call('bloc', { actions: group, params: params }).then(function (r) {
        group.forEach(function (k) {
          if (r && r[k] && r[k].err === undefined) ranger(k, r[k].v);
          else if (r && r[k]) garde(new Error(r[k].err));
        });
      }).catch(garde));
    }
    return Promise.all(jobs).then(function () {
      var ko = keys.filter(function (k) { return !PAGES[k]; });
      if (ko.length) throw (err || new Error('Lecture impossible : ' + ko.join(', ')));
    });
  }
  function rafraichir(keys) {
    return chargerBloc(keys).catch(function () { });
  }
  function apresEcriture(action) {
    var deps = DEPS[action];
    if (deps === undefined) { Object.keys(PAGES).forEach(function (k) { PAGES[k].t = 0; }); return; }
    var keys = [];
    deps.forEach(function (k) {
      if (k === 'appel*') Object.keys(PAGES).forEach(function (x) { if (x.indexOf('appel|') === 0) keys.push(x); });
      else if (PAGES[k]) keys.push(k);
    });
    setTimeout(function () { rafraichir(keys); }, 0);
  }
  // page qui lit une ou plusieurs clés : affichage immédiat si en cache, sinon chargement
  function swrN(keys, render) {
    var gen = S.gen;
    function draw() { render(keys.map(function (k) { return PAGES[k].data; })); }
    keys.forEach(function (k) { RENDU[k] = { gen: gen, fn: function () { if (keys.every(function (x) { return PAGES[x]; })) draw(); } }; });
    var manquent = keys.filter(function (k) { return !PAGES[k]; });
    if (!manquent.length) {
      draw();
      var vieux = keys.filter(function (k) { return Date.now() - PAGES[k].t > FRAIS; });
      if (vieux.length) rafraichir(vieux);
      return Promise.resolve();
    }
    return chargerBloc(manquent).then(function () { if (S.gen === gen) draw(); });
  }
  function swr(key, render) { return swrN([key], function (d) { render(d[0]); }); }

  // Chargement a la connexion.
  // Cote serveur, chaque lecture est en cache et un declencheur la recalcule toutes les
  // 10 min : l'ERP ne fait plus que lire des reponses deja pretes. On peut donc tout
  // demander d'un coup, en deux allers-retours seulement, et tous les ecrans sont immediats.
  var ESSENTIEL = ['accueil', 'cours', 'stages', 'urgencesTous', 'agenda', 'rappels', 'notesSite'];
  var FOND = {
    piste: ['appelsTous*'],
    gestion: ['compta', 'achats', 'remunerations', 'factures', 'intervenants', 'facturesInterv',
      'mails', 'aRelancer', 'docs', 'appelsTous*']
  };
  function chargerTout(fresh) {
    var box = $('#bootLoad'), bar = $('#bootBar'), txt = $('#bootTxt');
    box.hidden = false;
    var etapes = [['Connexion', 4], [Vmaj('membres') + ', ' + V('coursPl') + ' et ' + V('stagePl'), 65], ['Prêt', 100]];
    function etape(i) { bar.style.width = etapes[i][1] + '%'; txt.textContent = etapes[i][0] + (i ? ' ✓' : '…'); }
    etape(0);
    var debut = fresh ? call('ping', { fresh: true }).catch(function () { }) : Promise.resolve();
    var fin = debut.then(function () { return chargerBloc(ESSENTIEL).catch(function () { }); }).then(function () { etape(1); });
    var maxi = new Promise(function (r) { setTimeout(r, 40000); });
    return Promise.race([fin, maxi]).then(function () {
      etape(2); box.hidden = true;
      setTimeout(function () { chargerFond(); }, 120);
    });
  }
  /** Le reste, juste apres l'affichage : l'ERP est deja utilisable pendant ce temps. */
  function chargerFond() {
    S.fondPret = false;
    var l = (FOND[profil()] || []).slice();
    var appels = l.indexOf('appelsTous*') >= 0;
    l = l.filter(function (k) { return k !== 'appelsTous*'; });
    var p = l.length ? rafraichir(l) : Promise.resolve();
    // toutes les fiches d'appel, cours ET stages, pour que l'appel s'ouvre sans attendre
    if (appels) p = p.then(function () {
      return call('appelsTous').then(function (all) {
        Object.keys(all || {}).forEach(function (k) { ranger('appel|' + k, all[k]); });
      }).catch(function () { });
    });
    return p.then(function () { S.fondPret = true; });
  }
  setInterval(function () { if (S.pin && document.visibilityState !== 'hidden') rafraichir(Object.keys(PAGES)); }, FRAIS);
  function prechargerAppel(src, cle) {
    var k = 'appel|' + src + '|' + cle;
    if (PAGES[k]) return;
    charger(k).catch(function () { });
  }

  var toastT;
  function toast(msg, err) {
    var t = $('#toast');
    t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
    clearTimeout(toastT); toastT = setTimeout(function () { t.className = 'toast'; }, err ? 5000 : 2600);
  }
  function fail(e) { toast(e && e.message ? e.message : String(e), true); }

  function busy(btn, on) { if (btn) { btn.disabled = on; if (on) { btn.dataset.txt = btn.innerHTML; btn.innerHTML = '…'; } else if (btn.dataset.txt) btn.innerHTML = btn.dataset.txt; } }

  // ================= icônes =================
  function svg(p) { return '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>'; }
  var ICON = {
    home: svg('<path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/>'),
    cours: svg('<path d="M12 3 2 20h20Z"/><path d="M12 3v17"/>'),
    stage: svg('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'),
    urg: svg('<path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z"/><path d="M12 8v5M12 16h.01"/>'),
    compta: svg('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),
    facture: svg('<path d="M6 2h9l5 5v15H6Z"/><path d="M14 2v6h6M9 13h7M9 17h7"/>'),
    agenda: svg('<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M8 13h3"/>'),
    mail: svg('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>'),
    comm: svg('<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>'),
    site: svg('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>'),
    docs: svg('<path d="M3 7h6l2 2h10v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>'),
    more: svg('<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>'),
    phone: svg('<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>'),
    plus: svg('<path d="M12 5v14M5 12h14"/>'),
    back: svg('<path d="m15 18-6-6 6-6"/>'),
    ext: svg('<path d="M14 4h6v6M20 4 10 14M19 14v6H4V5h6"/>'),
    search: svg('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
    check: svg('<rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 12 3 3 5-6"/>'),
    refresh: svg('<path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/>')
  };

  var NAV = [
    { id: 'accueil', label: 'Accueil', ic: 'home' },
    { id: 'cours', label: 'Cours annuels', short: 'Cours', ic: 'cours' },
    { id: 'stages', label: 'Stages', ic: 'stage' },
    { id: 'urgences', label: 'Infos urgentes', short: 'Urgences', ic: 'urg' },
    { id: 'compta', label: 'Compta', ic: 'compta' },
    { id: 'factures', label: 'Devis & factures', short: 'Factures', ic: 'facture' },
    { id: 'facturation', label: 'Ma facturation', short: 'Ma facture', ic: 'facture' },
    { id: 'agenda', label: 'Agenda & rappels', ic: 'agenda' },
    { id: 'mails', label: 'Mails & relances', ic: 'mail' },
    { id: 'site', label: 'Notes site web', ic: 'site' },
    { id: 'docs', label: 'Docs & rapports', ic: 'docs' }
  ];
  var BOTTOM = ['accueil', 'cours', 'stages', 'urgences'];

  // Deux profils. « Piste » ne charge que ce qui sert sur le terrain, donc l'ERP s'ouvre
  // plus vite et le menu est plus court. « Gestion » voit tout.
  var PROFILS = {
    piste: { label: 'Piste', aide: 'Accueil, cours, stages, urgences, agenda', vues: ['accueil', 'cours', 'stages', 'urgences', 'agenda', 'site'] },
    gestion: { label: 'Gestion', aide: 'Tout l\'ERP, compta comprise', vues: null }
  };
  function profil() { return PROFILS[S.profil] ? S.profil : 'gestion'; }
  function navVisible() {
    var v = PROFILS[profil()].vues;
    return v ? NAV.filter(function (n) { return v.indexOf(n.id) >= 0; }) : NAV;
  }
  function setProfil(p) {
    S.profil = PROFILS[p] ? p : 'gestion';
    try { localStorage.setItem('erpProfil', S.profil); } catch (e) { }
    var vis = navVisible().map(function (n) { return n.id; });
    renderNav();
    go(vis.indexOf(S.view) >= 0 ? S.view : 'accueil');
  }
  function renderNav() {
    var vis = navVisible();
    $('#sideNav').innerHTML = vis.map(function (n) {
      return '<button class="nav-item' + (S.view === n.id ? ' on' : '') + '" data-go="' + n.id + '"><span class="ic">' + ICON[n.ic] + '</span>' + esc(n.label) + '</button>';
    }).join('') +
      '<div class="profil"><span class="muted small">Mode</span>' + Object.keys(PROFILS).map(function (p) {
        return '<button class="chip' + (profil() === p ? ' on' : '') + '" data-act="profil" data-p="' + p + '" title="' + esc(PROFILS[p].aide) + '">' + esc(PROFILS[p].label) + '</button>';
      }).join('') + '</div>';
    var bas = BOTTOM.filter(function (id) { return vis.some(function (n) { return n.id === id; }); });
    $('#bottomNav').innerHTML = bas.map(function (id) {
      var n = NAV.filter(function (x) { return x.id === id; })[0];
      return '<button class="' + (S.view === id ? 'on' : '') + '" data-go="' + id + '"><span class="ic">' + ICON[n.ic] + '</span>' + esc(n.short || n.label) + '</button>';
    }).join('') + '<button class="' + (bas.indexOf(S.view) < 0 ? 'on' : '') + '" data-act="menu"><span class="ic">' + ICON.more + '</span>Plus</button>';
  }

  function go(view, param) {
    S.view = view; S.param = param || null; S.gen = (S.gen || 0) + 1;
    renderNav();
    closeDrawer();
    var el = $('#view');
    el.innerHTML = '<div class="loader"><span></span></div>';
    window.scrollTo(0, 0);
    var fn = VIEWS[view];
    Promise.resolve().then(function () { return fn(el, param); }).catch(function (e) {
      el.innerHTML = '<div class="empty"><b>Oups.</b><br>' + esc(e.message || e) + '<br><br><button class="btn" data-go="' + esc(view) + '">Réessayer</button></div>';
    });
  }

  // ================= drawer =================
  function openDrawer(title, html) {
    $('#drawerTitle').textContent = title;
    $('#drawerBody').innerHTML = html;
    $('#drawer').classList.add('open');
    $('#drawer').setAttribute('aria-hidden', 'false');
  }
  function drawerBody(html) { $('#drawerBody').innerHTML = html; }
  function closeDrawer() { S.attentePrefill = null; $('#drawer').classList.remove('open'); $('#drawer').setAttribute('aria-hidden', 'true'); }

  var ACT = {};
  ACT.profil = function (t) { setProfil(t.dataset.p); };
  // relit tout depuis les Sheets (utile après une modif faite à la main dans un Sheet : case verte...)
  ACT.refresh = function () {
    closeDrawer();
    chargerTout(true).then(function () { go(S.view, S.param); toast('À jour'); });
  };

  // ================= PIN =================
  function forgetPin() { S.pin = ''; try { localStorage.removeItem('erp_pin'); } catch (e) {} }
  function showPin(msg) {
    forgetPin();

  }

  }

      busy(btn, false);
      try { localStorage.setItem('erp_pin', S.pin); } catch (e) {}   // mémorisé seulement si le code est bon
      $('#pinScreen').hidden = true;
      chargerTout().then(function () { if ($('#pinScreen').hidden) go(S.view, S.param); });

    if (t.dataset.go) { ev.preventDefault(); go(t.dataset.go, t.dataset.param ? JSON.parse(t.dataset.param) : null); return; }

  };

  function P(obj) { return esc(JSON.stringify(obj)); }

  // ================= composants =================
  function eleveItem(e, extra) {
    var badges = [];
    if (e.alerteSante) badges.push('<span class="b red">Santé</span>');
    if (e.signale) badges.push('<span class="b red" title="Case en rouge dans le Sheet">Signalé</span>');

    if (e.statut === 'Désinscrit') badges.push('<span class="b dark">Désinscrit</span>');

  function urgCard(e) {
    var sante = [];

    if (e.sante && !isRas(e.sante)) sante.push('<dt>Santé / PAI</dt><dd class="health">' + esc(e.sante) + '</dd>');

        return '<div class="li click" data-act="eleve" data-src="' + esc(e.source) + '" data-id="' + esc(e.id) + '"><span class="avatar">' + esc(initials(e)) + '</span><div class="main"><div class="t">' + esc(e.prenom + ' ' + e.nom) + '</div><div class="s">' + esc(e.ts) + '</div></div><span class="b">' + (e.source === 'cours' ? 'Cours' : 'Stage') + '</span></div>';

  function renderGroupe(el, src, cle) {

    if (!g) { el.innerHTML = '<div class="empty">Groupe introuvable.</div>'; return; }
    var titre = src === 'cours' ? g.jour + ' ' + g.horaire : g.nom + ' · ' + grp(g.groupe);
    var sous = src === 'cours' ? g.libelle + ' · ' + eur(g.tarif) + '/an' : g.dates + ' · ' + g.public;
    var prefill = src === 'cours' ? g.cle : g.id;
    var h = '<button class="btn ghost sm" data-go="' + src + '">' + ICON.back + 'Retour</button>' +

        var hay = normTxt([e.nom, e.prenom, e.responsable, e.tel, e.emailBest, e.creneaux, e.stage].join(' '));
        return words.every(function (w) { return hay.indexOf(w) >= 0; });
      });
      $('#res').innerHTML = res.length ? '<div class="grid gauto">' + res.slice(0, 80).map(urgCard).join('') + '</div>' : '<div class="empty">Aucun résultat.</div>';
    }
    q.addEventListener('input', show);
    setTimeout(function () { q.focus(); }, 50);
    return swr('urgencesTous', function (d) { list = d; show(); });
  };

  // ---------- Fiche d'un inscrit ----------
  ACT.eleve = function (t) { ficheEleve(t.dataset.src, t.dataset.id); };

  // fiche individuelle : affichée tout de suite depuis le cache, puis vérifiée auprès du serveur
  function eleveEnCache(src, id) {
    var d = PAGES[src] && PAGES[src].data;
    if (!d) return null;
    var groupes = src === 'cours' ? d.cours : d.stages, trouve = null, mes = [];
    groupes.forEach(function (g) {
      g.eleves.forEach(function (e) {
        if (e.id !== id) return;
        trouve = e;
        mes.push(src === 'cours' ? { cle: g.cle, label: g.jour + ' ' + g.horaire + ' · ' + g.libelle } : { cle: g.id, label: g.nom + ' · ' + grp(g.groupe) });
      });
    });
    if (!trouve) (d.nonClasses || []).concat(d.desinscrits || []).forEach(function (e) { if (e.id === id) trouve = e; });
    if (!trouve) return null;
    var c = JSON.parse(JSON.stringify(trouve)); c.groupes = mes;
    return c;
  }
  function ficheEleve(src, id) {
    var c = eleveEnCache(src, id);
    if (c) { openDrawer(c.prenom + ' ' + c.nom, ''); dessinerFiche(c); }
    else openDrawer('Fiche', '<div class="loader"><span></span></div>');
    call('eleve', { source: src, id: id }).then(function (e) {
      if (!$('#drawer').classList.contains('open')) return;
      if (c) {
        if (!S.data.eleve || S.data.eleve.id !== id || !$('#fPaye')) return;       // on a changé d'écran
        var ae = document.activeElement;
        if (ae && ae.closest && ae.closest('#drawerBody') && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) return;
        if (JSON.stringify(e) === JSON.stringify(c)) return;
      }
      dessinerFiche(e);
    }).catch(function (err) { if (!c) fail(err); });
  }
  function dessinerFiche(e) {
    {
      var src = e.source, id = e.id;
      S.data.eleve = e;
      $('#drawerTitle').textContent = e.prenom + ' ' + e.nom;
      var kv = function (pairs) {
        return '<dl class="kv">' + pairs.filter(function (p) { return p[1] !== undefined && p[1] !== ''; }).map(function (p) { return '<dt>' + esc(p[0]) + '</dt><dd' + (p[2] ? ' class="neg"' : '') + '>' + esc(p[1]) + '</dd>'; }).join('') + '</dl>';
      };
      var h = '';
      h += '<div class="box' + (e.alerteSante ? ' alert' : '') + '"><h4>Santé & urgence</h4>' + kv([
        ['Allergies', e.allergies, !isRas(e.allergies)], ['Santé / PAI', e.sante, !isRas(e.sante)], ['Vaccins à jour', e.vaccins],
        ['Personne à prévenir', e.urgence || 'NON RENSEIGNÉ', !e.urgence], ['Autorisation soins', e.soins || 'NON RENSEIGNÉ', !e.soins],
        ['Repart seul', e.repartSeul], ['Personnes autorisées', e.autorises]]) + '<div>' + telLinks([e.urgence, e.tel, e.second].join(' ')) + '</div></div>';
      h += '<div class="box"><h4>Identité & inscription</h4>' + kv([
        ['Naissance', e.naissance + (e.age !== '' ? ' (' + e.age + ' ans)' : '')], [src === 'cours' ? 'Créneau(x)' : 'Stage', e.creneaux || e.stage],
        ['Niveau', e.niveau], ["Cours d'essai", e.essai], ['Inscrit le', e.ts], ['Droit image', e.image], ['Assurance RC', e.assurance], ['Adhésion', e.adhesion], ['Réductions', e.reductions]]) + '</div>';
      h += '<div class="box"><h4>Famille</h4>' + kv([['Responsable', e.responsable], ['Lien', e.lien], ['Téléphone', e.tel], ['Email', e.emailBest], ['2e contact', e.second], ['Adresse', e.adresse]]) + '</div>';
      h += '<div class="box"><h4>Suivi admin</h4>' +
        '<div class="row"><div class="field"><label>Paiement</label><select id="fPaye">' + ['Non', 'Partiel', 'Oui'].map(function (o) { return '<option' + (e.paye === o ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select></div>' +
        '<div class="field"><label>Montant reçu (€)</label><input id="fMontant" inputmode="decimal" value="' + esc(e.montantRecu) + '"></div>' +
        '<div class="field"><label>Mode</label><select id="fMode">' + ['', 'Virement', 'Chèque', 'Cash'].map(function (o) { return '<option' + (e.modeRecu === o ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select></div></div>' +
        '<div class="row"><div class="field"><label>Statut</label><select id="fStatut">' + ['Actif', 'Désinscrit'].map(function (o) { return '<option' + (e.statut === o ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select></div></div>' +
        '<div class="field"><label>Notes</label><textarea id="fNotes">' + esc(e.notes) + '</textarea></div>' +
        '<label class="small" style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><input type="checkbox" id="fCaisse"> Ajouter aussi ce montant dans la caisse (Modele_economique)</label>' +
        '<button class="btn primary" data-act="saveSuivi">Enregistrer le suivi</button>' +
        '<p class="muted small">Payé = case Nom en vert dans le Sheet réponses. Enregistrer ici met la case en vert (payé), en jaune (partiel) ou enlève la couleur.' + (e.payeSource ? ' Statut actuel lu depuis : ' + esc(e.payeSource) + '.' : '') + '</p>' +
        (e.modePaiement ? '<p class="muted small">Mode choisi dans le Form : ' + esc(e.modePaiement) + '</p>' : '') +
        (e.derniereRelance ? '<p class="muted small">Dernière relance : ' + esc(e.derniereRelance) + '</p>' : '') + '</div>';
      h += '<div class="box' + (e.statut === 'Désinscrit' ? ' alert' : '') + '"><h4>Présence sur les listes</h4>' +
        (e.statut === 'Désinscrit'
          ? '<p class="small" style="margin-top:0"><b>' + esc(e.prenom) + '</b> est noté <b>désinscrit</b> : plus compté dans les effectifs, plus proposé dans les fiches d\'appel, plus relancé.</p>' +
            '<button class="btn" data-act="desister" data-s="Actif">Remettre dans le cours</button>'
          : '<p class="small" style="margin-top:0">Départ en cours d\'année, désistement, changement d\'avis : le retirer des effectifs et des fiches d\'appel. La ligne reste dans le Sheet réponses, rien n\'est effacé.</p>' +
            '<button class="btn danger" data-act="desister" data-s="Désinscrit">Noter un désistement / une désinscription</button>') + '</div>';
      h += '<div class="box"><h4>Actions</h4><div class="actions">' +
        '<button class="btn" data-act="mailApercu" data-type="confirmation">' + ICON.mail + 'Mail de confirmation</button>' +
        '<button class="btn" data-act="mailApercu" data-type="relance">' + ICON.mail + 'Mail de relance</button>' +
        '<button class="btn" data-act="deplacer">' + (src === 'cours' ? 'Changer de cours' : 'Changer de stage') + '</button>' +
        '<button class="btn" data-act="modifier">Modifier les infos</button>' +
        '<button class="btn danger" data-act="supprimer">Supprimer</button></div>' +
        (e.manquants.length ? '<p class="small" style="margin-bottom:0"><span class="b yellow">Manque</span> ' + esc(e.manquants.join(', ')) + '</p>' : '') + '</div>';
      drawerBody(h);
    }
  }

  ACT.desister = function (t) {
    var e = S.data.eleve, vers = t.dataset.s;
    if (!e) return;
    if (vers === 'Désinscrit' && !confirm(e.prenom + ' ' + e.nom + ' ne fait plus partie du cours ?\n\nIl / elle disparaît des effectifs et des fiches d\'appel. La ligne reste dans le Sheet réponses.')) return;
    busy(t, true);
    call('suivi', { source: e.source, id: e.id, nom: e.nom, prenom: e.prenom, Statut: vers })
      .then(function () {
        toast(vers === 'Désinscrit' ? 'Désistement noté' : 'Remis dans le cours');
        e.statut = vers; dessinerFiche(e);
        if (S.view === 'cours' || S.view === 'stages' || S.view === 'eleves') go(S.view, S.param);
      }).catch(function (err) { busy(t, false); fail(err); });
  };

  ACT.saveSuivi = function (t) {
    var e = S.data.eleve;
    var montant = $('#fMontant').value, mode = $('#fMode').value;
    var addCaisse = $('#fCaisse').checked;
    if (addCaisse && (!Number(String(montant).replace(',', '.')) || !mode)) return toast('Pour la caisse : montant et mode obligatoires', true);
    busy(t, true);
    call('suivi', { source: e.source, id: e.id, nom: e.nom, prenom: e.prenom, Paye: $('#fPaye').value, MontantRecu: montant, ModeRecu: mode, Statut: $('#fStatut').value, Notes: $('#fNotes').value })
      .then(function () {
        if (addCaisse) return call('ajouterRecette', { mode: mode, montant: String(montant).replace(',', '.'), libelle: e.prenom + ' ' + e.nom });
      })
      .then(function () { toast('Suivi enregistré' + (addCaisse ? ' + caisse' : '')); busy(t, false); })
      .catch(function (err) { busy(t, false); fail(err); });

  // ---------- aperçu / envoi / modification d'un mail (fiche individuelle, relances, brouillons) ----------
  // o = { titre, to, sujet, corps, html, draftId?, eleve?: {source,id,type}, retour?: fn }
  // étiquette de relecture mise par Claude dans l'objet ([À COMPLÉTER], [À RELIRE], [PRÊT]) : elle ne part jamais au destinataire
  function etiqBadge(e) {
    if (!e) return '';
    var t = e.replace(/[\[\]]/g, '').trim();
    var cls = /relire/i.test(t) ? 'red' : (/compl/i.test(t) ? 'yellow' : 'green');
    return '<span class="b ' + cls + '">' + esc(t) + '</span> ';
  }
  function mailViewer(o) {
    S.mail = o;
    openDrawer(o.titre, '<div class="mailhead"><div><span class="muted">À</span> <b>' + esc(o.to || 'pas d\'adresse !') + '</b></div><div><span class="muted">Objet</span> ' + etiqBadge(o.etiquette) + '<b>' + esc(o.sujet) + '</b></div>' +
      (o.etiquette ? '<div class="small muted">Étiquette mise par Claude, elle est retirée automatiquement à l\'envoi.</div>' : '') + '</div>' +
      '<iframe class="mailframe" sandbox title="Aperçu du mail"></iframe>' +
      (o.piecesJointes ? '<p class="small" style="color:var(--red)">Ce brouillon a ' + o.piecesJointes + ' pièce(s) jointe(s) : l\'envoyer ici les garde, mais le modifier ici les enlève (modifie-le dans Gmail).</p>' : '') +
      '<div class="actions mail-actions"><button class="btn primary big" data-act="mailEnvoyer"' + (o.to ? '' : ' disabled') + '>Envoyer</button>' +
      '<button class="btn" data-act="mailEditer">Modifier</button>' +
      (o.draftId ? '<button class="btn danger" data-act="mailSupprimer">Supprimer</button>' : '<button class="btn" data-act="mailBrouillon"' + (o.to ? '' : ' disabled') + '>Garder en brouillon</button>') +
      (o.retour ? '<button class="btn ghost" data-act="mailRetour">Retour</button>' : '') + '</div>' +
      // feuilletage : passer d'un mail de relance au suivant sans refermer l'aperçu
      (o.nav ? '<div class="actions" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;margin-top:4px">' +
        '<button class="btn sm" data-act="foyerNav" data-f="' + (o.nav.i - 1) + '"' + (o.nav.i <= 0 ? ' disabled' : '') + '>◀ Précédent</button>' +
        '<span class="muted small">Mail ' + (o.nav.i + 1) + ' sur ' + o.nav.n + '</span>' +
        '<button class="btn sm" data-act="foyerNav" data-f="' + (o.nav.i + 1) + '"' + (o.nav.i >= o.nav.n - 1 ? ' disabled' : '') + '>Suivant ▶</button></div>' : ''));
    var fr = $('#drawerBody .mailframe');
    fr.srcdoc = '<!doctype html><meta charset="utf-8"><base target="_blank"><style>body{margin:0}</style>' + (o.html || '<pre style="white-space:pre-wrap;font:14px Arial;padding:12px">' + esc(o.corps || '') + '</pre>');
  }
  function mailEditeur() {
    var o = S.mail;
    drawerBody('<form id="fMail"><div class="field"><label>À</label><input name="to" value="' + esc(o.to || '') + '" required></div>' +
      '<div class="field"><label>Objet</label><input name="sujet" value="' + esc(o.sujet || '') + '" required></div>' +
      '<div class="field"><label>Message</label><textarea name="corps" rows="14" style="min-height:300px">' + esc(o.corps || '') + '</textarea></div>' +
      '<p class="muted small">Le logo et la mise en page de la structure sont ajoutés automatiquement.</p>' +
      '<div class="actions"><button class="btn primary big" type="submit" data-then="envoyer">Envoyer</button>' +
      '<button class="btn" type="submit" data-then="brouillon">' + (o.draftId ? 'Enregistrer le brouillon' : 'Garder en brouillon') + '</button>' +
      '<button class="btn ghost" type="button" data-act="mailAnnuler">Annuler</button></div></form>');
    var f = $('#fMail'), then = 'envoyer';
    $all('button[type=submit]', f).forEach(function (b) { b.addEventListener('click', function () { then = b.dataset.then; }); });
    f.addEventListener('submit', function (ev) {
      ev.preventDefault();
      o.to = f.to.value.trim(); o.sujet = f.sujet.value; o.corps = f.corps.value; o.edite = true;
      mailAction(then, $('button[data-then=' + then + ']', f));
    });
  }
  function mailAction(what, btn) {
    var o = S.mail;
    if (what === 'envoyer' && !confirm('Envoyer maintenant ce mail à ' + o.to + ' ?')) return;
    if (what === 'supprimer' && !confirm('Supprimer ce brouillon ?')) return;
    busy(btn, true);
    var pr;
    if (o.draftId) {
      if (what === 'supprimer') pr = call('brouillonSupprimer', { id: o.draftId });
      else if (o.edite) pr = call('brouillonModifier', { id: o.draftId, a: o.to, sujet: o.sujet, corps: o.corps }).then(function () { return what === 'envoyer' ? call('brouillonEnvoyer', { id: o.draftId }) : true; });
      else pr = what === 'envoyer' ? call('brouillonEnvoyer', { id: o.draftId }) : Promise.resolve(true);
    } else {
      var p = { source: o.eleve.source, id: o.eleve.id, type: o.eleve.type };
      // corpsPret : le texte affiché est déjà le bon (mail de foyer), on l'envoie tel quel
      if (o.edite || o.corpsPret) { p.to = o.to; p.sujet = o.sujet; p.corps = o.corps; }
      // mail de famille : la date de relance se note sur tous les enfants du foyer
      if (o.items && o.items.length) p.items = o.items;
      pr = call(what === 'envoyer' ? 'envoyerMail' : 'brouillon', p);
    }
    pr.then(function () {
      toast(what === 'envoyer' ? 'Mail envoyé à ' + o.to : (what === 'supprimer' ? 'Brouillon supprimé' : 'Brouillon enregistré dans Gmail'));
      if (o.retour) o.retour(); else { closeDrawer(); if (S.view === 'mails') go('mails'); }
    }).catch(function (err) { busy(btn, false); fail(err); });
  }
  ACT.mailEnvoyer = function (t) { mailAction('envoyer', t); };
  ACT.mailBrouillon = function (t) { mailAction('brouillon', t); };
  ACT.mailSupprimer = function (t) { mailAction('supprimer', t); };
  ACT.mailEditer = function () { mailEditeur(); };
  ACT.mailAnnuler = function () { var o = S.mail; o.edite ? mailViewer(Object.assign(o, { html: '' })) : mailViewer(o); };
  ACT.mailRetour = function () { if (S.mail && S.mail.retour) S.mail.retour(); };
  // aperçu d'un mail pour un inscrit (confirmation / relance), sans rien créer
  function apercuEleve(source, id, type, retour) {
    openDrawer(type === 'relance' ? 'Relance' : 'Confirmation', '<div class="loader"><span></span></div>');
    return call('apercuMail', { source: source, id: id, type: type }).then(function (m) {
      mailViewer({ titre: (type === 'relance' ? 'Relance' : 'Confirmation'), to: m.to, sujet: m.sujet, corps: m.corps, html: m.html, eleve: { source: source, id: id, type: type }, retour: retour });
    }).catch(fail);
  }
  ACT.mailApercu = function (t) {
    var e = S.data.eleve;
    apercuEleve(e.source, e.id, t.dataset.type, function () { ficheEleve(e.source, e.id); });
  };
  ACT.eleveBack = function () { var e = S.data.eleve; ficheEleve(e.source, e.id); };

  ACT.deplacer = function () {

      var h = '<p class="muted small" style="margin-top:0">Les changements sont écrits directement dans le Sheet réponses (colonne ' + (e.source === 'cours' ? 'Créneau(x)' : 'Stage(s)') + '). Les fiches de présence se recalent toutes seules (1 à 2 min, et chaque matin à 7h).</p>';
      if (!mes.length) h += '<div class="box alert">Créneau actuel non reconnu : « ' + esc(e.creneaux || e.stage) + ' ». Choisis le bon ci-dessous avec « Ajouter », puis corrige le texte via Modifier les infos si besoin.</div>';
      (e.groupes || []).forEach(function (g) {

          '<div class="field"><label>Déplacer vers</label><select data-de="' + esc(g.cle) + '" class="selVers">' + opts(mes) + '</select></div>' +

          (mes.length > 1 ? '<button class="btn danger" data-act="retirerOk" data-de="' + esc(g.cle) + '">Retirer de ce ' + (e.source === 'cours' ? 'cours' : 'stage') + '</button>' : '') + '</div></div>';

  function champGroupes(src, groupes, cles, texteInconnu) {

  ACT.scrollTo = function (t) {

  // un bloc de l'onglet Synthese (valeurs telles qu'affichées dans le Sheet)
  // Trois scenarios cote a cote : le reve (7 eleves partout), le previsionnel, le reel a ce jour.
  // Les chiffres viennent tels quels de l'onglet Synthese, rien n'est recalcule ici.
  function blocScenarios(prev, poles) {
    var optRec = null;
    if (poles && poles.total && poles.entetes) {
      poles.entetes.forEach(function (e, i) {
        if (i > 0 && /previ|optimal/i.test(e) && poles.total.nums[i] !== null) optRec = poles.total.nums[i];
      });
    }
    var cols = [
      { t: 'Si 7 inscrits partout', rec: optRec, remu: prev['Rémunération potentielle'], ch: prev['Charges de structure'], res: prev['Résultat si 7 élèves partout'] },
      { t: 'Prévisionnel', rec: prev['Total année (recettes)'], remu: prev['À payer aux intervenants'], ch: prev['Charges de structure'], res: prev['Résultat net'] },
      { t: 'Réel à ce jour', rec: prev['Total encaissé à ce jour'], remu: prev['À payer aux intervenants'], ch: prev['Charges réelles'], res: prev['Résultat net réel'] }
    ];
    if (!cols.some(function (c) { return c.res !== undefined; })) return '';
    var cell = function (v, abs) {
      if (v === undefined || v === null) return '<td class="num muted">-</td>';
      if (abs) v = Math.abs(v);
      return '<td class="num' + (v < 0 ? ' neg' : '') + '">' + eur(v) + '</td>';
    };
    // les charges sont saisies en négatif dans le Sheet : on les affiche en positif, la ligne dit déjà que c'est une charge
    var ligne = function (lib, k, gras, abs) {
      return '<tr' + (gras ? ' style="font-weight:700"' : '') + '><td>' + lib + '</td>' + cols.map(function (c) { return cell(c[k], abs); }).join('') + '</tr>';
    };
    return '<div class="card section"><h3>Les trois scénarios de la saison</h3>' +
      '<div class="tscroll"><table class="t"><thead><tr><th></th>' + cols.map(function (c) { return '<th class="num">' + esc(c.t) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      ligne('Recettes', 'rec') + ligne('Rémunération des intervenants', 'remu') + ligne('Charges de structure', 'ch', false, true) + ligne('Résultat', 'res', true) +
      '</tbody></table></div>' +
      '<p class="muted small" style="margin:8px 0 0">Les charges de structure sont ramenées au total, le détail poste par poste se lit dans le Sheet. La rémunération par intervenant est dans le bloc du dessus.</p></div>';
  }

  // Le tableau des poles de la Synthese, le seul qu'on recopie encore
  function blocPoles(p) {
    if (!p) return '';
    var ligne = function (o, gras) {
      return '<tr' + (gras ? ' style="font-weight:700"' : '') + '>' + o.cells.map(function (v, c) {
        var n = o.nums[c];
        var cls = c > 0 ? 'num' + ((n !== null && n < 0) || /^\(|^-\d/.test(v) ? ' neg' : '') : '';
        return '<td' + (cls ? ' class="' + cls + '"' : '') + ' data-l="' + esc(p.entetes[c] || '') + '">' + esc(v) + '</td>';
      }).join('') + '</tr>';
    };
    return '<div class="card section"><h3>Par pôle d\'activité</h3><div class="tscroll"><table class="t resp"><thead><tr>' +
      p.entetes.map(function (e, i) { return '<th' + (i ? ' class="num"' : '') + '>' + esc(e) + '</th>'; }).join('') +
      '</tr></thead><tbody>' + p.lignes.map(function (l) { return ligne(l); }).join('') + (p.total ? ligne(p.total, true) : '') +
      '</tbody></table></div></div>';
  }

  function fiRenduMois() {

  function fiTrierMois() { S.fiMois = (S.fiMois || []).filter(function (v, i, a) { return a.indexOf(v) === i; }).sort(); }
  /** Les bornes envoyées au serveur : du premier au dernier mois coché */
  function fiMoisBornes() {

    return { debut: m[0] || '', fin: m[m.length - 1] || m[0] || '' };
  }
  ACT.fiMoisPlus = function () {
    var choix = S.fiMoisChoix || [];
    var dernier = (S.fiMois || []).slice().sort().pop();
    var k = choix.map(function (m) { return m.v; }).indexOf(dernier);
    var suivant = choix[Math.min(k + 1, choix.length - 1)];
    if (!suivant || S.fiMois.indexOf(suivant.v) >= 0) {
      // le mois suivant est déjà pris : on prend le premier libre
      suivant = choix.filter(function (m) { return S.fiMois.indexOf(m.v) < 0; })[0];
    }
    if (!suivant) { toast('Tous les mois de la liste sont déjà pris', true); return; }
    S.fiMois.push(suivant.v);
    fiTrierMois(); fiRenduMois(); ACT.fiProposer({});

    busy(t, true);
    call('mailsAction', { ids: ids, action: t.dataset.a }).then(function (r) {
      // mise à jour locale immédiate, le serveur confirme en arrière-plan
      var m = PAGES.mails && PAGES.mails.data;
      if (m) { m.threads = m.threads.filter(function (x) { return ids.indexOf(x.id) < 0; }); m.nonLus = Math.max(0, m.nonLus - r.n); }
      toast(r.n + ' mail(s) ' + (corb ? 'à la corbeille' : 'marqué(s) comme lu(s)'));
      go('mails');
    }).catch(function (e) { busy(t, false); fail(e); });
  };
  ACT.voirRelance = function (t) {
    var e = S.data.aRelancer[+t.dataset.i];
    apercuEleve(e.source, e.id, 'relance', null);
  };
  /**
   * Aperçu du mail de relance d'un foyer : c'est le mail complet, tel qu'il partira,
   * frères et sœurs compris. Le texte est déjà là, rien n'est demandé au serveur,
   * donc on feuillette les familles instantanément.
   */
  function apercuFoyer(fi) {
    var l = S.data.foyers || [];
    if (!l.length) return;
    fi = Math.max(0, Math.min(l.length - 1, +fi || 0));
    var f = l[fi];
    var e0 = f.eleves[0];
    mailViewer({
      titre: 'Relance · ' + f._noms,
      to: f.email, sujet: f.sujet, corps: f.corps,
      html: String(f.html || '').split('{{LOGO}}').join(S.data.relLogo || ''),
      eleve: { source: e0.source, id: e0.id, type: 'relance' },
      items: f.eleves.map(function (e) { return { source: e.source, id: e.id }; }),
      corpsPret: true,                  // le corps affiché est celui du foyer, pas celui d'un seul enfant
      nav: { i: fi, n: l.length }
    });
  }
  ACT.voirFoyer = function (t) { apercuFoyer(t.dataset.f); };
  ACT.foyerNav = function (t) { apercuFoyer(t.dataset.f); };
  ACT.voirBrouillon = function (t) {
    openDrawer('Brouillon', '<div class="loader"><span></span></div>');
    call('brouillonVoir', { id: t.dataset.id }).then(function (d) {
      mailViewer({ titre: 'Brouillon', to: d.a, sujet: d.sujet, etiquette: d.etiquette, corps: d.corps, html: d.html, draftId: d.id, piecesJointes: d.piecesJointes });
    }).catch(fail);
  };
  ACT.relAll = function () { $all('.relFoyer').forEach(function (c) { c.checked = true; }); };
  ACT.relNone = function () { $all('.relFoyer').forEach(function (c) { c.checked = false; }); };
  /** Les inscriptions cochées, à plat : un foyer coché = tous ses enfants */
  function relItems() {
    var items = [];
    $all('.relFoyer').filter(function (c) { return c.checked; }).forEach(function (c) {
      String(c.dataset.idx || '').split(',').filter(String).forEach(function (i) {
        var e = S.data.aRelancer[+i];
        if (e) items.push({ source: e.source, id: e.id });
      });
    });
    return items;
  }
  /**
   * Relance déjà partie ailleurs (mail écrit à la main, téléphone) : on note juste la date,
   * sinon ces familles restent dans la liste et se font relancer deux fois.
   */
  ACT.relNoter = function (t) {
    var items = relItems();
    if (!items.length) return toast('Coche au moins une ligne', true);
    if (!confirm('Noter ' + items.length + ' inscription(s) comme relancées aujourd\'hui ? Aucun mail ne part.')) return;
    busy(t, true);
    call('noterRelance', { items: items }).then(function (r) {
      toast(r.n + ' relance(s) notée(s)' + (r.erreurs.length ? ', ' + r.erreurs.length + ' erreur(s)' : ''), !!r.erreurs.length);
      go('mails');
    }).catch(function (err) { busy(t, false); fail(err); });
  };
  ACT.relGo = function (t) {
    var items = relItems();
    if (!items.length) return toast('Coche au moins une ligne', true);
    busy(t, true);
    call('brouillonsRelance', { items: items }).then(function (r) { toast(r.crees + ' brouillon(s) créé(s)' + (r.erreurs.length ? ', ' + r.erreurs.length + ' erreur(s)' : ''), !!r.erreurs.length); go('mails'); }).catch(function (err) { busy(t, false); fail(err); });
  };

  // ---------- Comm : envoyer des images depuis le téléphone, la tablette ou l'ordi ----------
  ACT.ajoutImages = function () {
    openDrawer('Ajouter des images', '<form id="fUp"><div class="field"><label>Dossier</label><select name="dossier"><option>Chargement…</option></select></div>' +
      '<label class="upzone"><input type="file" name="files" accept="image/*,application/pdf,video/*" multiple hidden><b>' + ICON.plus + ' Choisir des photos</b><span class="muted small">Sur téléphone : galerie ou appareil photo. Plusieurs à la fois possible.</span></label>' +
      '<div id="upList" class="up-list"></div><button class="btn primary big" type="submit" style="width:100%" disabled>Envoyer dans le Drive</button></form>');
    var f = $('#fUp'), fichiers = [];
    call('mediasDossiers').then(function (ds) {
      f.dossier.innerHTML = ds.map(function (d, i) { return '<option value="' + esc(d.id) + '"' + (i === 0 ? ' selected' : '') + '>' + esc(d.nom) + '</option>'; }).join('');
    }).catch(fail);
    f.files.addEventListener('change', function () {
      fichiers = Array.prototype.slice.call(f.files.files);
      $('#upList').innerHTML = fichiers.map(function (x, i) {
        return '<div class="up-item" id="up' + i + '">' + (/^image\//.test(x.type) ? '<img alt="" src="' + URL.createObjectURL(x) + '">' : '<span class="b">' + esc(x.type.split('/')[1] || 'fichier') + '</span>') +
          '<div class="main"><div class="t">' + esc(x.name) + '</div><div class="s">' + (x.size / 1048576).toFixed(1) + ' Mo</div></div><span class="st muted small">prêt</span></div>';
      }).join('');
      f.querySelector('button[type=submit]').disabled = !fichiers.length;
    });
    f.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var btn = f.querySelector('button[type=submit]'); busy(btn, true);
      var ok = 0, i = 0;
      function suivant() {
        if (i >= fichiers.length) {
          busy(btn, false); btn.textContent = ok + ' / ' + fichiers.length + ' envoyé(s)';
          toast(ok + ' fichier(s) ajouté(s) dans le Drive');
          var gen = S.gen;
          call('rafraichirMedias').then(function () { if (S.view === 'comm' && S.gen === gen) VIEWS.comm($('#view')); }).catch(function () { });
          return;
        }
        var k = i++, x = fichiers[k], st = $('#up' + k + ' .st');
        st.textContent = 'envoi…';
        preparer(x).then(function (b) {
          return call('uploadMedia', { name: b.name, mime: b.mime, data: b.data, dossier: f.dossier.value });
        }).then(function () { ok++; st.textContent = '✓'; st.style.color = 'var(--green)'; })
          .catch(function (e) { st.textContent = 'erreur'; st.style.color = 'var(--red)'; st.title = e.message; })
          .then(suivant);
      }
      suivant();
    });
  };
  // fichier -> base64 ; une photo de plus de 12 Mo est réduite (4000 px, JPEG 90 %) pour passer vite
  function preparer(file) {
    function lire(blob) {
      return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result).split(',')[1]); }; r.onerror = rej; r.readAsDataURL(blob); });
    }
    if (!/^image\/(jpeg|png|webp)/.test(file.type) || file.size <= 12 * 1048576) return lire(file).then(function (d) { return { name: file.name, mime: file.type || 'application/octet-stream', data: d }; });
    return new Promise(function (res) {
      var img = new Image();
      img.onload = function () {
        var sc = Math.min(1, 4000 / Math.max(img.width, img.height));
        var c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function (b) { lire(b).then(function (d) { res({ name: file.name.replace(/\.\w+$/, '') + '.jpg', mime: 'image/jpeg', data: d }); }); }, 'image/jpeg', 0.9);
      };
      img.src = URL.createObjectURL(file);
    });
  }

  // ---------- Comm (médiathèque) ----------
  VIEWS.comm = function (el, param) {
    var force = param && param.refresh;
    return call(force ? 'rafraichirMedias' : 'medias').then(function (list) {
      S.data.medias = list;
      S.data.mediaFilter = S.data.mediaFilter || 'image';
      el.innerHTML = '<div class="page-head"><div><h1>Comm</h1><p>Photos et affiches du dossier Comm > Photo & Affiche du Drive</p></div><div class="actions"><button class="btn primary" data-act="ajoutImages">' + ICON.plus + 'Ajouter des images</button><button class="btn" data-go="comm" data-param="' + P({ refresh: 1 }) + '">Rafraîchir</button></div></div>' +
        '<div class="search">' + ICON.search + '<input id="mq" type="search" placeholder="Chercher : logo, stage, story, reel..."></div>' +
        '<div class="chips" id="mchips">' + [['tout', 'Tout'], ['image', 'Images'], ['texte', 'Textes / plans'], ['pdf', 'PDF'], ['video', 'Vidéos']].map(function (c) {
          return '<button class="chip' + (S.data.mediaFilter === c[0] ? ' on' : '') + '" data-act="mfilter" data-f="' + c[0] + '">' + c[1] + '</button>';
        }).join('') + '</div><div id="mgrid"></div>';
      $('#mq').addEventListener('input', renderMedias);
      renderMedias();
    });
  };
  ACT.mfilter = function (t) { S.data.mediaFilter = t.dataset.f; $all('#mchips .chip').forEach(function (c) { c.classList.toggle('on', c === t); }); renderMedias(); };
  var thumbQueue = [], thumbBusy = 0, thumbObs = null;
  function renderMedias() {
    var q = ($('#mq').value || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    var f = S.data.mediaFilter;
    var list = S.data.medias.filter(function (m) {
      if (f !== 'tout' && m.type !== f) return false;
      if (!q) return true;
      return (m.nom + ' ' + m.dossier).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').indexOf(q) >= 0;
    }).slice(0, 200);
    var sym = { texte: 'Aa', pdf: 'PDF', video: '▶', autre: '•' };
    $('#mgrid').innerHTML = list.length ? '<div class="media-grid">' + list.map(function (m) {
      return '<div class="media" data-act="media" data-id="' + esc(m.id) + '"><div class="th" data-thumb="' + (m.type === 'image' ? esc(m.id) : '') + '">' + (m.type === 'image' ? '' : esc(sym[m.type] || '•')) + '</div><div class="cap"><b>' + esc(m.nom) + '</b><span class="muted">' + esc(m.dossier.split(' / ').slice(-1)[0]) + ' · ' + esc(m.date) + '</span></div></div>';
    }).join('') + '</div>' : '<div class="empty">Rien trouvé.</div>';
    thumbQueue = [];
    if (thumbObs) thumbObs.disconnect();
    thumbObs = 'IntersectionObserver' in window ? new IntersectionObserver(function (ents) {
      ents.forEach(function (en) { if (en.isIntersecting) { thumbObs.unobserve(en.target); queueThumb(en.target); } });
    }, { rootMargin: '200px' }) : null;
    $all('[data-thumb]').forEach(function (n) { if (n.dataset.thumb) { if (thumbObs) thumbObs.observe(n); else queueThumb(n); } });
  }
  var thumbCache = {};
  function queueThumb(node) { thumbQueue.push(node); pumpThumbs(); }
  function pumpThumbs() {
    while (thumbBusy < 4 && thumbQueue.length) {
      var node = thumbQueue.shift(), id = node.dataset.thumb;
      if (thumbCache[id]) { node.style.backgroundImage = 'url("' + thumbCache[id] + '")'; continue; }
      thumbBusy++;
      (function (node, id) {
        call('miniature', { id: id }).then(function (data) {
          data = safeImg(data);
          if (data) { thumbCache[id] = data; node.style.backgroundImage = 'url("' + data + '")'; } else node.textContent = '🖼';
        }).catch(function () { node.textContent = '🖼'; }).then(function () { thumbBusy--; pumpThumbs(); });
      })(node, id);
    }
  }
  ACT.media = function (t) {
    var m = S.data.medias.filter(function (x) { return x.id === t.dataset.id; })[0];
    if (!m) return;
    if (m.type === 'texte') {
      openDrawer(m.nom, '<div class="loader"><span></span></div>');
      call('texteDoc', { id: m.id }).then(function (d) {
        S.data.texte = d.texte;
        drawerBody('<div class="actions" style="margin-bottom:12px"><button class="btn primary" data-act="copyTexte">Copier le texte</button><a class="btn" href="' + esc(safeUrl(d.url)) + '" target="_blank" rel="noopener">' + ICON.ext + 'Ouvrir le Doc</a></div><pre class="mail">' + esc(d.texte) + '</pre>');
      }).catch(fail);
      return;
    }
    var img = thumbCache[m.id];
    openDrawer(m.nom, (img ? '<img src="' + img + '" alt="" style="width:100%;border-radius:12px;background:#fff;border:1px solid var(--line)">' : '') +
      '<p class="muted small">' + esc(m.dossier) + ' · modifié le ' + esc(m.date) + '</p><div class="actions"><a class="btn primary" href="' + esc(safeUrl(m.url)) + '" target="_blank" rel="noopener">' + ICON.ext + 'Ouvrir dans Drive (télécharger)</a></div>');
  };
  ACT.copyTexte = function () {
    var txt = S.data.texte || '';
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function () { toast('Texte copié'); }).catch(function () {
      var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      toast(ok ? 'Texte copié' : 'Copie impossible, sélectionne le texte à la main', !ok);
      ta.remove();
    });
  };

  // ---------- Notes site ----------
  VIEWS.site = function (el, param) {
    return swr('notesSite', function (list) {
      S.data.notes = list;
      var f = (param && param.f) || 'ouvert';
      var shown = list.filter(function (n) { return f === 'tout' ? true : (f === 'fait' ? n.Statut === 'Fait' : n.Statut !== 'Fait'); });
      var h = '<div class="page-head"><div><h1>Notes site web</h1><p>Mises à jour à faire sur le site public</p></div><div class="actions"><a class="btn" href="https://example.org" target="_blank" rel="noopener">' + ICON.ext + 'Voir le site</a><button class="btn primary" data-act="newNote">' + ICON.plus + 'Note</button></div></div>';
      h += '<div class="chips">' + [['ouvert', 'À faire / en cours'], ['fait', 'Faites'], ['tout', 'Toutes']].map(function (c) {
        return '<button class="chip' + (f === c[0] ? ' on' : '') + '" data-go="site" data-param="' + P({ f: c[0] }) + '">' + c[1] + '</button>';
      }).join('') + '</div>';
      h += '<div class="card">' + (shown.length ? '<div class="list">' + shown.map(function (n) {
        var pc = { Haute: 'red', Normale: '', Basse: 'blue' }[n.Priorite] || '';
        var sc = { 'À faire': 'yellow', 'En cours': 'blue', 'Fait': 'green' }[n.Statut] || '';
        return '<div class="li notes"><div class="main"><div class="t">' + esc(n.Description) + '</div><div class="s">' + esc([n.Page, n.Date, n.Auteur].filter(Boolean).join(' · ')) + '</div></div>' +
          '<span class="b ' + pc + '">' + esc(n.Priorite) + '</span><span class="b ' + sc + '">' + esc(n.Statut) + '</span>' +
          '<div class="nact">' + (n.Statut === 'Fait' ? '<button class="btn sm ghost" data-act="noteFait" data-id="' + esc(n.ID) + '" data-s="À faire">Rouvrir</button>'
            : '<button class="btn sm primary" data-act="noteFait" data-id="' + esc(n.ID) + '" data-s="Fait">' + ICON.check + 'Fait</button>') +
          '<button class="btn sm ghost" data-act="noteEdit" data-id="' + esc(n.ID) + '">✎</button><button class="btn sm ghost danger" data-act="noteDel" data-id="' + esc(n.ID) + '">✕</button></div></div>';
      }).join('') + '</div>' : '<div class="empty">Aucune note.</div>') + '</div>';
      el.innerHTML = h;
    });
  };
  function noteForm(n) {
    n = n || {};
    return '<form id="fNote"><div class="field"><label>Page / section</label><input name="Page" value="' + esc(n.Page || '') + '" placeholder="Accueil, Planning, Stages, Tarifs..."></div>' +
      '<div class="field"><label>Ce qu\'il faut changer</label><textarea name="Description" required>' + esc(n.Description || '') + '</textarea></div>' +
      '<div class="row"><div class="field"><label>Priorité</label><select name="Priorite">' + ['Haute', 'Normale', 'Basse'].map(function (o) { return '<option' + ((n.Priorite || 'Normale') === o ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label>Statut</label><select name="Statut">' + ['À faire', 'En cours', 'Fait'].map(function (o) { return '<option' + ((n.Statut || 'À faire') === o ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label>Qui</label><input name="Auteur" value="' + esc(n.Auteur || '') + '" placeholder="Dominique"></div></div>' +
      '<input type="hidden" name="ID" value="' + esc(n.ID || '') + '"><input type="hidden" name="Date" value="' + esc(n.Date || '') + '"><button class="btn primary" type="submit">Enregistrer</button></form>';
  }
  function bindNote() {
    $('#fNote').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var f = ev.target, o = {}; $all('[name]', f).forEach(function (i) { o[i.name] = i.value; });
      var btn = $('button[type=submit]', f); busy(btn, true);
      call('saveNoteSite', o).then(function () { toast('Note enregistrée'); closeDrawer(); go('site', S.param); }).catch(function (err) { busy(btn, false); fail(err); });
    });
  }
  ACT.newNote = function () { openDrawer('Nouvelle note site', noteForm()); bindNote(); };
  ACT.noteEdit = function (t) { var n = S.data.notes.filter(function (x) { return String(x.ID) === t.dataset.id; })[0]; openDrawer('Modifier la note', noteForm(n)); bindNote(); };
  ACT.noteFait = function (t) {
    busy(t, true);
    call('statutNoteSite', { ID: t.dataset.id, Statut: t.dataset.s }).then(function (st) { toast(st === 'Fait' ? 'Tâche faite' : 'Tâche rouverte'); go('site', S.param); }).catch(function (e) { busy(t, false); fail(e); });
  };
  ACT.noteDel = function (t) { if (!confirm('Supprimer cette note ?')) return; call('deleteNoteSite', { ID: t.dataset.id }).then(function () { go('site', S.param); }).catch(fail); };

  // ---------- Docs & rapports ----------
  VIEWS.docs = function (el) {
    return Promise.all([call('docs'), call('rapports')]).then(function (r) {
      var d = r[0], rap = r[1];
      var h = '<div class="page-head"><div><h1>Docs & rapports</h1><p>Les fichiers qu\'on utilise tout le temps + les rapports de Claude (veille matos, tri des mails)</p></div></div>';
      h += '<div class="grid g2" style="align-items:start"><div class="card"><h3>' + ICON.docs + 'Fichiers clés</h3><div class="list">' + d.fixes.map(function (f) {
        return '<a class="li click" href="' + esc(safeUrl(f.url)) + '" target="_blank" rel="noopener" style="text-decoration:none;color:inherit"><div class="main"><div class="t">' + esc(f.nom) + '</div></div>' + ICON.ext + '</a>';
      }).join('') + '</div><div class="hr"></div><h3>Dossier admin</h3><div class="list">' + (d.admin.map(function (f) {
        return '<a class="li click" href="' + esc(safeUrl(f.url)) + '" target="_blank" rel="noopener" style="text-decoration:none;color:inherit"><div class="main"><div class="t">' + esc(f.nom) + '</div><div class="s">' + esc(f.date) + '</div></div>' + ICON.ext + '</a>';
      }).join('') || '<div class="muted">Vide.</div>') + '</div></div>';
      h += '<div class="card"><h3>Rapports Claude</h3>' + (rap.length ? '<div class="list">' + rap.map(function (f) {
        return '<div class="li click" data-act="rapport" data-id="' + esc(f.id) + '" data-mime="' + esc(f.mime) + '" data-url="' + esc(f.url) + '" data-nom="' + esc(f.nom) + '"><span class="b ' + (f.type === 'Veille matos' ? 'yellow' : 'blue') + '">' + esc(f.type) + '</span><div class="main"><div class="t">' + esc(f.nom) + '</div><div class="s">' + esc(f.date) + '</div></div></div>';
      }).join('') + '</div>' : '<div class="muted">Pas encore de rapport. Les tâches planifiées de Claude déposent ici la veille matériel et le tri des mails.</div>') + '</div></div>';
      el.innerHTML = h;
    });
  };
  ACT.rapport = function (t) {
    if (t.dataset.mime !== 'application/vnd.google-apps.document') { window.open(t.dataset.url, '_blank', 'noopener'); return; }
    openDrawer(t.dataset.nom, '<div class="loader"><span></span></div>');
    call('texteDoc', { id: t.dataset.id }).then(function (d) {
      drawerBody('<div class="actions" style="margin-bottom:12px"><a class="btn" href="' + esc(safeUrl(d.url)) + '" target="_blank" rel="noopener">' + ICON.ext + 'Ouvrir le Doc</a></div><pre class="mail">' + esc(d.texte) + '</pre>');
    }).catch(fail);
  };

  VIEWS.accueil = function (el) { return accueilView(el); };

  // ================= démarrage =================
  renderNav();
  (window.__INFO && window.__INFO.nom ? Promise.resolve(window.__INFO) : call('info')).then(function (i) {
    var logo = safeImg(i.logo);
    if (logo) {
      S.logo = logo;
      $all('.brand-dot').forEach(function (n) {
        var img = document.createElement('img');
        img.src = logo; img.alt = i.nom; img.className = 'logo' + (n.classList.contains('big') ? ' big' : '');
        n.replaceWith(img);
      });
    }
    $('#sideFoot').innerHTML = esc(i.nom) + (i.tel ? '<br>Urgences : <a href="tel:' + esc(String(i.tel).replace(/\s/g, '')) + '" style="color:var(--yellow)">' + esc(i.tel) + '</a>' : '') +
      '<br><button class="btn sm ghost" style="color:#e9dfcf;border-color:#3a3232;margin-top:8px" data-act="refresh">Actualiser</button> <button class="btn sm ghost" style="color:#e9dfcf;border-color:#3a3232;margin-top:8px" data-act="lock">Verrouiller</button>';
    if (!i.pinConfigure) { noPin('Aucun code PIN (4 caractères minimum) dans l\'onglet Config du classeur ERP. Ajoute-le puis recharge la page.'); return; }
    if (!S.pin) { showPin(''); return; }
    chargerTout().then(function () { if ($('#pinScreen').hidden) go('accueil'); });
  }).catch(function (e) { $('#view').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
})();
</script>
