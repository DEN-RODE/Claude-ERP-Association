<!DOCTYPE html>
<html lang="fr">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <script>window.__INFO = <?!= info ?>;</script>
  <?!= include('Styles'); ?>
</head>
<body>
  <div id="app">
    <aside class="side">
      <div class="brand"><span class="brand-dot"></span><div><b><?= nom ?></b><small>ERP</small></div></div>
      <nav id="sideNav"></nav>
      <div class="side-foot" id="sideFoot"></div>
    </aside>
    <header class="topbar">
      <div class="brand small"><span class="brand-dot"></span><b><?= nom ?></b></div>
      <button class="icon-btn" data-act="refresh" aria-label="Actualiser" style="margin-left:auto">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>
      </button>
      <button class="icon-btn" id="btnSearchTop" aria-label="Rechercher une personne inscrite">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
    </header>
    <main id="view" tabindex="-1"><div class="loader"><span></span></div></main>
    <nav class="bottom" id="bottomNav"></nav>
  </div>

  <div id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-bg" data-close></div>
    <section class="drawer-panel" role="dialog" aria-modal="true">
      <header class="drawer-head"><h2 id="drawerTitle"></h2><button class="icon-btn" data-close aria-label="Fermer">✕</button></header>
      <div id="drawerBody" class="drawer-body"></div>
    </section>
  </div>

  <div id="pinScreen" class="pin" hidden>
    <form id="pinForm" class="pin-card">
      <span class="brand-dot big"></span>
      <h1><?= nom ?></h1>
      <p>Code d'accès de l'ERP</p>
      <input id="pinInput" type="password" inputmode="numeric" autocomplete="current-password" required>
      <button class="btn primary" type="submit">Entrer</button>
      <p class="err" id="pinErr"></p>
    </form>
  </div>

  <div id="bootLoad" class="bootload" hidden>
    <div class="bootcard"><span class="brand-dot big"></span><h2>Chargement de l'ERP</h2>
      <div class="bootbar"><i id="bootBar"></i></div><p id="bootTxt" class="muted small">Connexion…</p></div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <?!= include('App'); ?>
</body>
</html>
